[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mokashif"
version = "0.1.0"
description = "Mokashif (مكشاف) - State-of-the-art zero-shot change detection for large satellite imagery from any sensor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Goad" }]
keywords = [
    "satellite",
    "remote-sensing",
    "change-detection",
    "geospatial",
    "deep-learning",
    "foundation-models",
    "earth-observation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core scientific
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    # Geospatial I/O
    "rasterio>=1.3.10",
    "rioxarray>=0.17",
    "xarray>=2024.6",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "fiona>=1.10",
    # Deep learning (torch installed separately to match CUDA)
    "torch>=2.3",
    "torchvision>=0.18",
    "einops>=0.8",
    "timm>=1.0",
    # Pipeline / config / CLI
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # Visualisation (offline capable)
    "matplotlib>=3.9",
    "folium>=0.17",
    # Server (optional offline API)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Performance
    "dask[array]>=2024.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-tqdm>=4.66",
]
foundation = [
    # Foundation / SOTA model backends. Heavy; optional.
    "transformers>=4.42",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "accelerate>=0.31",
]
preprocess = [
    # Heavy optional preprocessing extras.
    "arosics>=1.10",  # sub-pixel co-registration
    "omnicloudmask>=1.0",  # SOTA cloud masking (Sentinel-2 / Landsat)
]
viewer = [
    "leafmap>=0.36",
    "ipywidgets>=8.1",
]
all = [
    "mokashif[foundation,preprocess,viewer]",
]

[project.scripts]
mokashif = "mokashif.cli:app"

[project.urls]
Repository = "https://github.com/gohangoad-sketch/mokashif"
Issues = "https://github.com/gohangoad-sketch/mokashif/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mokashif"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models_cache"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (Typer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "tests/fixtures/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "network: marks tests that require network access",
]

[tool.coverage.run]
source = ["src/mokashif"]
omit = ["*/tests/*", "*/__init__.py"]
